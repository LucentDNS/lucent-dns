name: 编译 DNS 过滤规则

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  push:
    paths:
      - 'configuration.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: 安装 hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: 编译规则
        run: hostlist-compiler -c configuration.json -o dns-filter.txt

      - name: 安装 AGLint
        run: npm install -g @adguard/aglint

      - name: 创建 AGLint 配置文件
        run: echo '{}' > .aglintrc

      - name: 检查规则质量
        run: npx aglint dns-filter.txt
        timeout-minutes: 2

      - name: 获取编译时间
        id: time
        run: echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: 发布到 Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "✨ Lucent DNS v${{ github.run_number }}"
          body: |
            ## 📋 编译信息

            | 项目 | 详情 |
            |------|------|
            | 编译时间 | ${{ steps.time.outputs.date }} |
            | 触发方式 | `${{ github.event_name }}` |
            | 运行编号 | #${{ github.run_number }} |
            | 提交哈希 | `${{ github.sha }}` |

            ## 📦 规则构成

            本规则集旨在为家庭网络提供**“设置后忘记”**级别的稳定过滤防护：

            - **HaGeZi's Normal Blocklist**（约 18 万条）：平衡防护，拦截广告、追踪、遥测、钓鱼、恶意软件。家庭环境首选，不拦截错误上报，极低误杀。
            - **HaGeZi's TIF Mini**（约 17.7 万条）：核心威胁情报防护，拦截恶意软件、钓鱼及 C2 通信。
            - **AWAvenue Ads Rule**（约 500 条）：国内 App 广告精准补全，专治开屏、摇一摇、信息流广告。

            > 三源合并去重压缩后，总规则约 35 万条。

            ## 🔧 使用方法

            在 AdGuard Home 或 AdGuard 客户端中添加以下订阅地址：

            `https://github.com/LucentDNS/lucent-dns/releases/latest/download/dns-filter.txt`

            ## ⚠️ 注意事项

            - 适合 **64MB 及以上内存** 的设备。
            - 适合家庭网络（父母、儿童设备），无需频繁手动维护白名单。
            - 如遇极端情况误拦，请在 AGH 查询日志中将域名加入白名单。

          files: dns-filter.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
