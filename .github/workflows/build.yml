name: Compile DNS Filter

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,6,12,18 * * *'
  push:
    paths:
      - 'configuration.json'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install hostlist-compiler
        run: npm install -g @adguard/hostlist-compiler

      - name: Create output directory
        run: mkdir -p dist

      - name: Compile AdGuard format
        run: hostlist-compiler -c configuration.json -o dist/dns-filter.txt

      - name: Install AGLint and check rule quality
        continue-on-error: true
        run: |
          npm install -g @adguard/aglint
          echo '{}' > .aglintrc
          npx aglint dist/dns-filter.txt
        timeout-minutes: 2

      - name: Get compilation stats
        id: stats
        run: |
          echo "date=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
          RULE_COUNT=$(grep -v '^!' dist/dns-filter.txt | grep -v '^$' | wc -l)
          echo "count=$RULE_COUNT" >> $GITHUB_OUTPUT

      - name: Push update to main branch (for jsDelivr)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add -f dist/dns-filter.txt
          git commit -m "Auto update DNS filter" || exit 0
          git push

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "✨ Lucent DNS v${{ github.run_number }}"
          body: |
            ## 📋 Compilation Info

            | Item | Details |
            |------|---------|
            | Compile Time | ${{ steps.stats.outputs.date }} |
            | Trigger | `${{ github.event_name }}` |
            | Run Number | #${{ github.run_number }} |
            | Commit Hash | `${{ github.sha }}` |

            ## 📦 Rule Composition

            - **HaGeZi's Pro Mini Blocklist**: Lightweight core ad and tracking blocklist.
            - **HaGeZi's Threat Intelligence Feeds Mini**: Compact threat intelligence list for phishing, malware, and scams.

            > **Target**: Ultra-lightweight, set-and-forget rules balancing security and performance. Ideal for mobile devices and low-end routers.
            > **Rule Count**: **${{ steps.stats.outputs.count }}** valid blocking rules generated in this build.

            ## 🔧 How to Use

            Add the following URL to AdGuard Home or AdGuard client:

            - **jsDelivr CDN (Recommended)**: `https://cdn.jsdelivr.net/gh/LucentDNS/lucent-dns@main/dist/dns-filter.txt`
            - **GitHub Release**: `https://github.com/LucentDNS/lucent-dns/releases/latest/download/dns-filter.txt`

            ## ⚠️ Notes

            - Based on HaGeZi's lists with aggressive rules trimmed. If you encounter a false positive, please open an Issue.

          files: dist/dns-filter.txt
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
